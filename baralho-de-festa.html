<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Baralho de Festa — Perguntas & Verdade ou Desafio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#150E2B;
    --ink-2:#1E1338;
    --ink-3:#2A1B4A;
    --paper:#F6EEDF;
    --paper-2:#EEE1C6;
    --teal:#1F6F63;
    --coral:#D9491F;
    --plum:#6D3FA6;
    --gold:#C79A4B;
    --gold-soft:#E4C784;
    --violet:#8B5CF6;
    --cream:#F4EDE4;
    --dim:#B9AED6;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 0%, #2A1B4A 0%, transparent 55%),
      radial-gradient(circle at 85% 15%, #241640 0%, transparent 45%),
      var(--ink);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }

  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:env(safe-area-inset-top,18px) 16px 18px;
  }

  /* ---------- HEADER ---------- */
  header{
    text-align:center;
    padding:6px 0 14px;
  }
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.28em;
    color:var(--gold-soft);
    text-transform:uppercase;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:28px;
    margin:4px 0 0;
    letter-spacing:-.01em;
  }
  h1 span{color:var(--violet);}

  /* ---------- TABS ---------- */
  .tabs{
    display:flex;
    background:var(--ink-2);
    border:1px solid #3A2A5C;
    border-radius:999px;
    padding:4px;
    margin:16px 0 6px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:11px 8px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    color:var(--dim);
    cursor:pointer;
    transition:all .25s ease;
    user-select:none;
  }
  .tab.active{
    background:linear-gradient(135deg,var(--violet),#6D3FA6);
    color:#fff;
    box-shadow:0 4px 14px rgba(139,92,246,.35);
  }

  .subline{
    text-align:center;
    font-size:12.5px;
    color:var(--dim);
    margin:2px 0 18px;
    min-height:16px;
  }

  /* ---------- CARD STAGE ---------- */
  .stage{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:380px;
    perspective:1600px;
  }

  .deck-shadow{
    position:absolute;
    width:78%;
    max-width:280px;
    aspect-ratio:5/7;
    border-radius:20px;
    background:var(--paper-2);
    border:2px solid #D8C69C;
  }
  .deck-shadow.s2{ transform:rotate(-7deg) translateY(10px); opacity:.55; }
  .deck-shadow.s1{ transform:rotate(4deg) translateY(4px); opacity:.8; }

  .card{
    position:relative;
    width:78%;
    max-width:280px;
    aspect-ratio:5/7;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.8,.25,1);
  }
  .card.flipped{ transform:rotateY(180deg); }
  .card.pulse{ animation:pulse .4s ease; }
  @keyframes pulse{ 50%{ transform:scale(.97) rotateY(var(--ry,0deg)); } }

  .face{
    position:absolute; inset:0;
    background:var(--paper);
    border-radius:20px;
    backface-visibility:hidden;
    border:2px solid var(--gold);
    box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 0 0 6px rgba(199,154,75,.15);
    display:flex;
    flex-direction:column;
    padding:16px;
    color:var(--ink);
  }
  .face.back{ transform:rotateY(180deg); }

  .idx{
    font-family:'Space Mono',monospace;
    font-size:12px;
    font-weight:700;
    display:flex;
    flex-direction:column;
    align-items:center;
    line-height:1.1;
    color:var(--ink-3);
  }
  .idx .glyph{ font-size:16px; margin-top:1px; }
  .corner-tl{ align-self:flex-start; }
  .corner-br{ align-self:flex-end; transform:rotate(180deg); margin-top:auto; }

  .card-body{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6px 10px;
    gap:14px;
  }
  .badge{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.22em;
    font-weight:700;
    padding:5px 14px;
    border-radius:999px;
    text-transform:uppercase;
  }
  .badge.perg{ background:rgba(31,111,99,.12); color:var(--teal); }
  .badge.verdade{ background:rgba(109,63,166,.12); color:var(--plum); }
  .badge.desafio{ background:rgba(217,73,31,.12); color:var(--coral); }
  .badge.resposta{ background:rgba(31,111,99,.12); color:var(--teal); }

  .card-text{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    line-height:1.32;
    color:var(--ink);
  }
  .face.back .card-text{ font-size:19px; }
  .hint{
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    color:#8b7f5f;
    margin-top:auto;
  }

  /* ---------- CONTROLS ---------- */
  .controls{
    margin-top:18px;
  }
  .progress-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--dim);
    margin-bottom:10px;
  }
  .bar{
    height:4px;
    background:#3A2A5C;
    border-radius:999px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .bar-fill{
    height:100%;
    background:linear-gradient(90deg,var(--violet),var(--gold));
    border-radius:999px;
    transition:width .3s ease;
  }
  .btn-row{
    display:flex;
    gap:10px;
  }
  button.act{
    flex:1;
    border:none;
    border-radius:14px;
    padding:14px 10px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:transform .15s ease, filter .15s ease;
  }
  button.act:active{ transform:scale(.96); }
  .btn-shuffle{
    background:var(--ink-2);
    color:var(--cream);
    border:1px solid #3A2A5C;
    flex:0 0 52px;
    font-size:18px;
    display:flex;align-items:center;justify-content:center;
  }
  .btn-next{
    background:linear-gradient(135deg,var(--violet),#5B34A0);
    color:#fff;
    box-shadow:0 8px 20px rgba(139,92,246,.3);
  }

  footer{
    text-align:center;
    font-size:10.5px;
    color:#5c5480;
    margin-top:16px;
    letter-spacing:.04em;
  }

  .toast{
    position:fixed;
    left:50%; bottom:26px;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink-2);
    border:1px solid var(--gold);
    color:var(--cream);
    padding:10px 18px;
    border-radius:999px;
    font-size:12.5px;
    opacity:0;
    pointer-events:none;
    transition:all .3s ease;
    z-index:20;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="eyebrow">Jogo de Cartas</div>
    <h1>Baralho de <span>Festa</span></h1>
  </header>

  <div class="tabs">
    <div class="tab active" data-mode="perguntas">Perguntas</div>
    <div class="tab" data-mode="td">Verdade ou Desafio</div>
  </div>
  <div class="subline" id="subline">Toque na carta para revelar a resposta</div>

  <div class="stage">
    <div class="deck-shadow s2"></div>
    <div class="deck-shadow s1"></div>
    <div class="card" id="card">
      <div class="face front">
        <div class="idx corner-tl"><span id="numFrontTL">1</span><span class="glyph" id="glyphFrontTL">?</span></div>
        <div class="card-body">
          <div class="badge perg" id="badgeFront">Geografia</div>
          <div class="card-text" id="textFront">Carregando...</div>
        </div>
        <div class="idx corner-br"><span id="numFrontBR">1</span><span class="glyph" id="glyphFrontBR">?</span></div>
      </div>
      <div class="face back">
        <div class="idx corner-tl"><span id="numBackTL">1</span><span class="glyph" id="glyphBackTL">✓</span></div>
        <div class="card-body">
          <div class="badge resposta" id="badgeBack">Resposta</div>
          <div class="card-text" id="textBack">—</div>
          <div class="hint" id="hintBack">Toque para voltar</div>
        </div>
        <div class="idx corner-br"><span id="numBackBR">1</span><span class="glyph" id="glyphBackBR">✓</span></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="progress-row">
      <span id="counter">Carta 1 / 100</span>
      <span id="modeLabel">PERGUNTAS</span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill" style="width:1%"></div></div>
    <div class="btn-row">
      <button class="act btn-shuffle" id="btnShuffle" title="Embaralhar">🔀</button>
      <button class="act btn-next" id="btnNext">Próxima carta →</button>
    </div>
  </div>

  <footer>Deslize, toque e jogue — 100 perguntas · 100 cartas de verdade ou desafio</footer>
</div>

<div class="toast" id="toast"></div>

const tdDeck = verdades.map(t => ({kind:"Verdade", text:t}))
  .concat(desafios.map(t => ({kind:"Desafio", text:t})));

/* ============ ESTADO ============ */
let mode = "perguntas";
let deckP = shuffle([...perguntas]);
let deckT = shuffle([...tdDeck]);
let idx = 0;
let flipped = false;

const el = id => document.getElementById(id);
const card = el("card");
const toastEl = el("toast");

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function currentDeck(){ return mode === "perguntas" ? deckP : deckT; }

function render(){
  const deck = currentDeck();
  const item = deck[idx];
  const num = idx + 1;
  const total = deck.length;

  el("counter").textContent = `Carta ${num} / ${total}`;
  el("modeLabel").textContent = mode === "perguntas" ? "PERGUNTAS" : "VERDADE OU DESAFIO";
  el("barFill").style.width = (num/total*100) + "%";
  el("subline").textContent = mode === "perguntas"
    ? "Toque na carta para revelar a resposta"
    : "Toque na carta e cumpra o combinado";

  [el("numFrontTL"), el("numFrontBR"), el("numBackTL"), el("numBackBR")]
    .forEach(n => n.textContent = num);

  if(mode === "perguntas"){
    el("glyphFrontTL").textContent = "?";
    el("glyphFrontBR").textContent = "?";
    el("glyphBackTL").textContent = "✓";
    el("glyphBackBR").textContent = "✓";
    el("badgeFront").className = "badge perg";
    el("badgeFront").textContent = item.c;
    el("textFront").textContent = item.q;
    el("badgeBack").className = "badge resposta";
    el("badgeBack").textContent = "Resposta";
    el("textBack").textContent = item.a;
    el("hintBack").textContent = "Toque para voltar";
  } else {
    const isVerdade = item.kind === "Verdade";
    el("glyphFrontTL").textContent = isVerdade ? "♥" : "⚡";
    el("glyphFrontBR").textContent = isVerdade ? "♥" : "⚡";
    el("glyphBackTL").textContent = "🎉";
    el("glyphBackBR").textContent = "🎉";
    el("badgeFront").className = "badge " + (isVerdade ? "verdade" : "desafio");
    el("badgeFront").textContent = item.kind;
    el("textFront").textContent = item.text;
    el("badgeBack").className = "badge " + (isVerdade ? "verdade" : "desafio");
    el("badgeBack").textContent = "Concluído";
    el("textBack").textContent = isVerdade ? "Respeito à sua verdade! 🙌" : "Missão cumprida! 🔥";
    el("hintBack").textContent = "Toque para voltar";
  }
}

function flip(){
  flipped = !flipped;
  card.classList.toggle("flipped", flipped);
}

function next(){
  const deck = currentDeck();
  flipped = false;
  card.classList.remove("flipped");
  idx++;
  if(idx >= deck.length){
    idx = 0;
    if(mode === "perguntas") deckP = shuffle([...perguntas]);
    else deckT = shuffle([...tdDeck]);
    showToast("Baralho reiniciado e embaralhado ✨");
  }
  card.classList.add("pulse");
  setTimeout(()=>card.classList.remove("pulse"), 400);
  render();
}

function reshuffle(){
  flipped = false;
  card.classList.remove("flipped");
  idx = 0;
  if(mode === "perguntas") deckP = shuffle([...perguntas]);
  else deckT = shuffle([...tdDeck]);
  showToast("Baralho embaralhado 🔀");
  render();
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toastEl.classList.remove("show"), 1600);
}

/* ============ EVENTOS ============ */
card.addEventListener("click", flip);
el("btnNext").addEventListener("click", next);
el("btnShuffle").addEventListener("click", reshuffle);

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    if(tab.dataset.mode === mode) return;
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    mode = tab.dataset.mode;
    idx = 0;
    flipped = false;
    card.classList.remove("flipped");
    render();
  });
});

/* swipe simples para avançar */
let touchStartX = 0;
card.addEventListener("touchstart", e => touchStartX = e.touches[0].clientX, {passive:true});
card.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 60) next();
}, {passive:true});

render();
</script>
